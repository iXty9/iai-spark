    <!-- Two-Phase Theme Initialization: Pre-React bootstrap for zero-flash theme application -->
    <script>
      (function() {
        try {
          // Phase 1: Get theme mode from sessionStorage (set during bootstrap or last session)
          var bootstrapMode = sessionStorage.getItem('bootstrap_current_theme_mode');
          var mode = bootstrapMode || 'light'; // Default to light if no session data
          
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(mode);
          
          // Phase 2: Apply critical CSS variables immediately
          if (mode === 'dark') {
            // Dark mode colors
            root.style.setProperty('--background', '0 0% 3.9%');
            root.style.setProperty('--foreground', '0 0% 98%');
            root.style.setProperty('--muted-foreground', '0 0% 75%');
            root.style.setProperty('--primary', '0 72.2% 50.6%');
          } else {
            // Light mode colors (explicit defaults)
            root.style.setProperty('--background', '0 0% 100%');
            root.style.setProperty('--foreground', '0 0% 3.9%');
            root.style.setProperty('--muted-foreground', '0 0% 45.1%');
            root.style.setProperty('--primary', '0 75% 60%');
          }
          
          // Prevent transition flash
          root.classList.add('theme-initializing');
        } catch (e) {
          // Silent fail - CSS defaults will apply
          console.warn('Theme bootstrap failed:', e);
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bust manifest cache on load -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var link = document.querySelector('link[rel="manifest"]');
        if (link && !link.href.includes('?v=')) {
          link.href = link.href + '?v=' + Date.now();
        }
      });
    </script>
